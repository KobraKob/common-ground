name: Refresh frontend dependency lock

on:
  push:
    branches:
      - product/common-ground-experience-upgrade
    paths:
      - "frontend/package.json"

permissions:
  contents: write

tasks:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: product/common-ground-experience-upgrade
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || true
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
          else
            git commit -m "chore: refresh patched frontend dependency lock"
            git push origin HEAD:product/common-ground-experience-upgrade
          fi
      - name: Trigger full quality gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quality-gates.yml --ref product/common-ground-experience-upgrade
