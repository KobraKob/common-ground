name: Generate Python dependency lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate hash-pinned dependency lock
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --generate-hashes --resolver=backtracking --output-file=backend/requirements.lock backend/requirements.in
      - name: Commit lockfile to the selected branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock
          if git diff --cached --quiet; then
            echo "Dependency lock is already current."
            exit 0
          fi
          git commit -m "chore: generate hash-pinned Python dependency lock"
          git push origin "HEAD:${{ github.ref_name }}"
