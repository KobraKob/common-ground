name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and integration tests
        run: pytest -q
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start production server
        run: npm run start > /tmp/commonground-next.log 2>&1 &
      - name: Wait for production server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/commonground-next.log
          exit 1
      - name: Smoke test rendered routes
        run: npm run smoke
      - name: Install ephemeral browser-test dependencies
        run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive and accessibility browser tests
        run: npm run e2e
      - name: Install pinned browser test tooling
        run: npm install --prefix /tmp/cg-e2e --no-save --package-lock=false playwright@1.54.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: /tmp/cg-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: npm run e2e
        env:
          NODE_PATH: /tmp/cg-e2e/node_modules
      - name: Collect mobile Lighthouse reports
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-ground-lighthouse-reports
          path: frontend/.lighthouseci
          if-no-files-found: warn
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
