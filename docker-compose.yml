version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: commonground-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: commonground
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./supabase/migrations/002_add_media_and_auth.sql:/docker-entrypoint-initdb.d/02_add_media.sql
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/03_colleges.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commonground"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commonground-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/commonground
      ENVIRONMENT: production
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commonground-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
